# ---------------------------------------------------------------------------
#  The three changes made to the image's default httpd.conf
#  (get it with: docker run --rm httpd:2.4-alpine cat /usr/local/apache2/conf/httpd.conf)
#
#  Visitors come through the Cloudflare tunnel, so without this Apache only
#  sees cloudflared's Docker IP. Cloudflare puts the real visitor IP in the
#  CF-Connecting-IP header. Only trust that header from a Docker network
#  (cloudflared), never from the LAN, or anyone on the LAN could fake it.
# ---------------------------------------------------------------------------

# 1. Uncomment the module (it is already in the image).
LoadModule remoteip_module modules/mod_remoteip.so

# 2. Log %a (the real client IP after remoteip) instead of %h, and use the
#    "combined" format (adds referer + user agent; CrowdSec's Apache parser wants it).
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# 3. Append at the end of the file.
<IfModule remoteip_module>
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 172.16.0.0/12
</IfModule>
