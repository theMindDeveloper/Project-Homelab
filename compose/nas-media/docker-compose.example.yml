# ---------------------------------------------------------------------------
#  Media and sync stack - runs on the NAS (UGREEN DH4300, UGOS Pro)
#
#  These live on the NAS rather than in the cluster for one concrete reason:
#  the library is on the NAS. Running Jellyfin next to the files removes both
#  the network share and the hardware-transcoding passthrough problem that an
#  unprivileged LXC would have had. The reasoning is in docs/04-lxc-vs-vm.md.
# ---------------------------------------------------------------------------
services:

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      # Media is mounted READ-ONLY. Jellyfin has no reason to write to the
      # library, and a media server that cannot delete your files is a media
      # server that cannot delete your files.
      - ${MEDIA_DIR}:/media:ro
    environment:
      - TZ=Europe/Berlin
    # Hardware transcoding on the NAS iGPU, if present:
    # devices:
    #   - /dev/dri:/dev/dri


  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    # Syncthing discovers peers on the LAN with broadcast, which does not
    # cross a bridge network. Host networking is the pragmatic answer.
    network_mode: host
    volumes:
      - ./syncthing/config:/var/syncthing/config
      - ${SYNC_DIR}:/var/syncthing/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
