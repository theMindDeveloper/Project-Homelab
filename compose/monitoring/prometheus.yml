# ---------------------------------------------------------------------------
#  Prometheus scrape configuration
#
#  Prometheus pulls. Every target below must be reachable FROM the container
#  this Prometheus runs in. The most common "target down" cause in a homelab
#  is using localhost in a target, which means the Prometheus container
#  itself, not the host.
# ---------------------------------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: theminddev-homelab

# Alerting is NOT configured yet. This is a deliberate, documented gap:
# see the "Known limitations" section of the README.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # ---------------------------------------------------------------------
  #  DEPLOYED: prometheus, all three Proxmox nodes, the Proxmox API
  #  exporter, the Raspberry Pi and the NAS are live.
  # ---------------------------------------------------------------------

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- security monitoring (compose/security, same compose project) ------
  # CrowdSec: alerts and "would block" decisions. Watch only, no bouncer.
  - job_name: crowdsec
    static_configs:
      - targets: ["crowdsec:6060"]

  # AdGuard Home on the Pi, through adguard-exporter.
  # Per-query histograms are dropped: many series, and no panel uses them.
  - job_name: adguard
    scrape_interval: 60s
    static_configs:
      - targets: ["adguard-exporter:9618"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "adguard_(processing_time_.*|queries_details_histogram_.*|dhcp_leases)"
        action: drop

  # --- the Proxmox nodes themselves ---------------------------------------
  # node_exporter installed on each node, not in a container:
  #   apt install prometheus-node-exporter
  - job_name: proxmox-host
    static_configs:
      - targets: ["192.168.178.20:9100"]   # P1
        labels: {node: pve}
      - targets: ["192.168.178.77:9100"]   # P2
        labels: {node: pve2}
      - targets: ["192.168.178.50:9100"]   # P3
        labels: {node: pve3}

  # --- the other always-on boxes: Raspberry Pi and UGREEN NAS -------------
  # node_exporter in a small Docker container on each (64 MB cap, read-only).
  # NAS: bridge network, so its network numbers are the container's own;
  # each HDD volume is visible through one empty read-only folder
  # (/disks/volume1, /disks/volume3) so disk usage per volume still shows.
  - job_name: other-hosts
    static_configs:
      - targets: ["192.168.178.178:9100"]   # Raspberry Pi
        labels: {node: pi}
      - targets: ["192.168.178.79:9100"]    # NAS
        labels: {node: nas}

  # --- Proxmox cluster metrics via the API --------------------------------
  # prometheus-pve-exporter runs as a container next to Prometheus, with an
  # API token that has only PVEAuditor (read-only). The token lives in the
  # exporter's env file (chmod 600), never here.
  #
  # Cluster data (every node, VM, LXC, storage) is the same whichever node
  # you ask, so it is fetched from ONE node. Asking all three stored every
  # series three times and drew triple gauges. Trade-off: if P1 is down,
  # cluster data pauses; node_exporter health above is not affected.
  - job_name: proxmox-api
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["0"]
    static_configs:
      - targets: ["192.168.178.20"]
    relabel_configs: &pve_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "pve-exporter:9221"   # service name on the compose network

  # Per-node extras (start-on-boot, replication) only exist per node, so
  # these are asked from each node, with the cluster part switched off.
  - job_name: proxmox-api-node
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["0"]
      node: ["1"]
    static_configs:
      - targets:
          - "192.168.178.20"
          - "192.168.178.77"
          - "192.168.178.50"
    relabel_configs: *pve_relabel

  # ---------------------------------------------------------------------
  #  NOT YET DEPLOYED. The exporters below are not installed, so these
  #  targets would show DOWN. They are kept here as the plan, and the gap
  #  is listed in the README's known limitations rather than hidden by a
  #  config file that looks complete.
  #
  #  To deploy: install node_exporter and cAdvisor in LXC 102.
  #  Runbook 10 has the full procedure.
  # ---------------------------------------------------------------------

  # --- the Docker LXC --------------------------------------------------------
  - job_name: hosts
    static_configs:
      - targets:
          - "192.168.178.87:9100"    # LXC 102

  - job_name: containers
    static_configs:
      - targets:
          - "192.168.178.87:8085"    # cAdvisor in LXC 102
