# ---------------------------------------------------------------------------
#  Monitoring stack - Prometheus, Grafana and the exporters that run next to them
#  Host:     LXC 102 "docker" (P1), folder /opt/monitoring
#  Runbooks: runbooks/10-monitoring-stack.md       (Prometheus, Grafana, exporters)
#            runbooks/23-alerts-to-telegram.md     (alerting)
#            runbooks/24-fritzbox-monitoring.md    (fritz-exporter)
#            runbooks/25-game-server-monitoring.md (game-exporter)
#  Concepts: docs/08-monitoring.md, docs/24-alerting.md
#
#  Division of labour:
#    Prometheus      - pulls numbers from every exporter on a schedule and stores them
#    Grafana         - draws them, and runs the alert rules (-> Telegram)
#    pve-exporter    - Proxmox API -> numbers (read-only token)
#    fritz-exporter  - FRITZ!Box router (TR-064) -> numbers
#    game-exporter   - AMP + Pterodactyl panel APIs -> numbers (our own ~150-line script)
#  node_exporter does NOT run here: it runs on each machine it reports on
#  (apt package on the Proxmox nodes, a container on the Pi and the NAS).
#
#  Prometheus PULLS. It reaches out to every target on an interval. Nothing
#  pushes to it. That is why adding a new host means editing prometheus.yml
#  and not touching the new host at all beyond installing an exporter.
#
#  Secrets live in *.env files next to this file (chmod 600, never in Git).
#  Every one of them has a *.env.example in this folder.
#
#  Logs (Loki, Alloy, CrowdSec) are a second compose file in compose/security/.
#  Start BOTH with the same project name so they share one Docker network and
#  can reach each other by service name:
#     docker compose -p stacks -f docker-compose.yml up -d
#  and never with --remove-orphans (it would delete the other file's containers).
# ---------------------------------------------------------------------------
services:

  prometheus:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Its own folder, read-only. A folder (not the single file) because editors
      # replace files when saving, and a single-file mount would keep showing the
      # old one. Reload after an edit:  docker kill -s HUP <prometheus container>
      # (Not the whole compose folder: that would show Prometheus the .env secrets.)
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # How long to keep data. The default is 15 days, which is too short to see
      # a slow leak. This lab still runs the default (see the README's known
      # limitations); 90 days is the recommendation and costs a few GB here.
      - --storage.tsdb.retention.time=90d
    security_opt:
      - no-new-privileges:true

  grafana:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Data sources, dashboard provider and ALL alerting (rules, Telegram
      # contact points, routing, quiet hours, message template) come from files.
      # Rebuild the container and everything is back, nothing to click.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON files, generated by scripts/grafana/gen_all.py.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    env_file:
      - .env            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
      - alerting.env    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (used in contact-points.yml)
    environment:
      # Anonymous access is off. Grafana on a LAN with anonymous viewing
      # enabled is a map of the network for anyone who gets on the wifi.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Grafana builds absolute URLs from this (login redirects, the link in
      # every Telegram alert). Get it wrong and links send you to the wrong host.
      - GF_SERVER_ROOT_URL=https://grafana.example.com
      # Open the Overview dashboard after login.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/homelab-overview.json
      - TZ=Europe/Berlin
    security_opt:
      - no-new-privileges:true

  # Reads the Proxmox API with a read-only token (role PVEAuditor) and reports
  # every node, VM, LXC and storage. Only Prometheus talks to it, so the port
  # is not published ("expose" = reachable on the Docker network only).
  pve-exporter:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    env_file: pve-exporter.env   # see pve-exporter.env.example
    expose:
      - "9221"
    security_opt:
      - no-new-privileges:true

  # FRITZ!Box router over TR-064: internet up/down, DSL speed and line quality,
  # traffic, Wi-Fi clients, known devices, MyFRITZ on/off, firmware updates.
  # Uses its own FRITZ!Box user with ONLY the "FRITZ!Box settings" right.
  fritz-exporter:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: pdreker/fritz_exporter:3.5.1
    restart: unless-stopped
    env_file: fritz.env          # see fritz.env.example
    environment:
      # Version 3.x listens on 127.0.0.1 by default. Inside a container that
      # means nobody else can reach it ("connection refused" in Prometheus).
      # 0.0.0.0 is still only the Docker network, because no port is published.
      - FRITZ_LISTEN_ADDRESS=0.0.0.0
    expose:
      - "9787"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

  # Which game servers run, players, CPU/RAM, uptime, ports - from the AMP and
  # Pterodactyl panel APIs. READ-ONLY. It is our own small script, using only
  # Python's standard library, so it can be read in five minutes:
  #   compose/monitoring/game-exporter/game_exporter.py
  # Ready-made exporters exist but have 0-50 GitHub stars; not worth trusting
  # with panel credentials when 150 readable lines do the job.
  game-exporter:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: python:3.13.16-alpine
    restart: unless-stopped
    command: ["python", "-I", "/app/game_exporter.py"]
    user: "65534:65534"          # nobody: the script needs no rights at all
    read_only: true              # and it writes nothing
    env_file: game-exporter.env  # see game-exporter.env.example
    volumes:
      - ./game-exporter:/app:ro
    expose:
      - "9788"
    mem_limit: 48m
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:

# Own network for everything that holds a secret or sees all logs. Internet-facing
# containers (the website, the tunnel connector) must never join it: pve-exporter
# sends its Proxmox token to whatever host a caller names, and Loki has no login.
# Both compose files of the project declare it; the second one reuses it.
networks:
  monitoring: {}
