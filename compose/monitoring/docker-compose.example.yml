# ---------------------------------------------------------------------------
#  Monitoring stack - Prometheus, Grafana, node_exporter, cAdvisor
#  Host: LXC 102 "docker" (P1)
#  Runbook: runbooks/10-monitoring-stack.md
#
#  Division of labour:
#    node_exporter  - metrics ABOUT a machine (CPU, RAM, disk, network)
#    cAdvisor       - metrics ABOUT containers on a machine
#    Prometheus     - pulls both on a schedule and stores them
#    Grafana        - draws them
#
#  Prometheus PULLS. It reaches out to every target on an interval. Nothing
#  pushes to it. That is why adding a new host means editing prometheus.yml
#  and not touching the new host at all beyond installing an exporter.
# ---------------------------------------------------------------------------
services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days at a 15 s scrape interval is a few GB for a lab this size.
      # The default is 15 days, which is too short to see a slow leak.
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      # Anonymous access is off. Grafana on a LAN with anonymous viewing
      # enabled is a map of the network for anyone who gets on the wifi.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Grafana builds absolute URLs from this. Get it wrong and login
      # redirects send you to the wrong host behind a reverse proxy.
      - GF_SERVER_ROOT_URL=${GF_ROOT_URL}
      - TZ=Europe/Berlin
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    # The exporter reports on the HOST, so it needs the host's view of things.
    # pid: host lets it see all processes; the bind mounts give it the real
    # /proc, /sys and root filesystem rather than the container's.
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    # cAdvisor inside an unprivileged LXC sees less than it would on bare
    # metal. Per-container CPU and memory work; some disk stats do not.
    # That is a known limitation of this setup, not a misconfiguration.

volumes:
  prometheus_data:
  grafana_data:
