# Grafana loads every dashboard JSON from /var/lib/grafana/dashboards into the "Homelab" folder.
# The JSON files are generated by scripts/grafana/gen_all.py; edit the generators, not the JSON.
# disableDeletion: false -> when a JSON file is removed here, Grafana removes that dashboard too.
apiVersion: 1
providers:
  - name: homelab
    folder: Homelab
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
