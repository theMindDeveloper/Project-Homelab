# Security monitoring. It only WATCHES and REPORTS. Nothing here blocks traffic
# (CrowdSec has no bouncer, so its "decisions" are only shown, never enforced).
# Folder /opt/security on LXC 102. Runbook: runbooks/21-logs-and-crowdsec.md
# Concepts: docs/23-logs-and-security-monitoring.md
# Run with the SAME project name as compose/monitoring, so Grafana and Prometheus
# reach these containers by name (loki, crowdsec, adguard-exporter):
#   docker compose -p stacks -f docker-compose.yml up -d      (never --remove-orphans)
services:
  # Log database, 30 days. Only on the Docker network (no host port).
  loki:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    expose:
      - "3100"
    volumes:
      - /opt/security/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 512m

  # Log collector: LXC 102 journal (sshd + all containers) and OPNsense firewall log.
  alloy:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    ports:
      - "1514:1514/udp"   # OPNsense sends syslog (filterlog) here
    volumes:
      - /opt/security/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/security/geoip:/geoip:ro   # dbip-city-lite.mmdb, downloaded by hand, not in Git
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 320m       # the GeoIP file (~125 MB) is memory-mapped, so a bit above 256m
    depends_on:
      - loki

  # Reads logs from Loki and spots attacks (SSH brute force, web scans, port scans).
  # WATCH ONLY: no bouncer, no online API (nothing is shared with crowdsec.net).
  crowdsec:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/sshd crowdsecurity/apache2 firewallservices/pf"
      DISABLE_ONLINE_API: "true"
    expose:
      - "6060"            # Prometheus metrics
    volumes:
      - /opt/security/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    mem_limit: 256m
    depends_on:
      - loki

  # AdGuard Home (Pi) numbers for Prometheus: queries, blocked share, top clients
  # and domains. Read-only API calls. Credentials of an AdGuard user in
  # adguard-exporter.env (see adguard-exporter.env.example).
  adguard-exporter:
    networks: [monitoring]   # NOT the default network: see the note at the end
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1
    restart: unless-stopped
    env_file: adguard-exporter.env
    environment:
      ADGUARD_SERVERS: "http://192.168.178.178:8000"
      INTERVAL: "60s"
    expose:
      - "9618"
    mem_limit: 64m

volumes:
  loki-data:
  alloy-data:
  crowdsec-config:
  crowdsec-data:

# Own network for everything that holds a secret or sees all logs. Internet-facing
# containers (the website, the tunnel connector) must never join it: pve-exporter
# sends its Proxmox token to whatever host a caller names, and Loki has no login.
# Both compose files of the project declare it; the second one reuses it.
networks:
  monitoring: {}
