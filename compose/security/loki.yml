# Loki = the log database. One small process, data on disk, keeps 30 days.
# Only reachable inside the Docker network (Alloy writes, Grafana + CrowdSec read).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-10-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Deletes data older than retention_period (runs every 10 min).
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

limits_config:
  retention_period: 720h            # 30 days
  ingestion_rate_mb: 4              # plenty for one LXC + OPNsense firewall log
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 6MB
  max_line_size: 256KB
  max_line_size_truncate: true
  max_global_streams_per_user: 2000 # guard against too many label combinations
  max_label_names_per_series: 10
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true   # country/city/IP stay out of labels
  volume_enabled: true
  max_query_series: 2000

# Keep memory small: modest caches.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 50

ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h

analytics:
  reporting_enabled: false          # no usage stats sent to Grafana Labs
