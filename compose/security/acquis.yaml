# CrowdSec reads its logs from Loki (no extra log agent, no file mounts).
# The "type" label tells CrowdSec which parser to use.
# WATCH ONLY: no bouncer is installed anywhere, so nothing is ever blocked.

# SSH logins on LXC 102 (Debian 13 logs them as sshd-session in ssh.service)
source: loki
url: http://loki:3100
query: '{host="lxc102", unit="ssh.service"}'
wait_for_ready: 60s
labels:
  type: sshd
---
# Apache (container "apache", see compose/apache). Behind the Cloudflare tunnel the
# real visitor IP only appears in the log because of mod_remoteip (runbook 22);
# without it every request comes from cloudflared's private Docker IP, which
# CrowdSec whitelists, and no web scenario can ever fire.
source: loki
url: http://loki:3100
query: '{host="lxc102", container="apache"}'
wait_for_ready: 60s
labels:
  type: apache2
---
# OPNsense firewall: only blocked packets (used for port-scan detection).
source: loki
url: http://loki:3100
query: '{job="opnsense", action="block"}'
wait_for_ready: 60s
labels:
  type: filterlog
