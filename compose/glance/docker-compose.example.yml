# ---------------------------------------------------------------------------
#  Glance - the single-pane dashboard for the whole lab
#  Host: LXC 102 "docker" (P1)   Hostname: glance.theminddev.com
#  Config: ./glance.yml  (see glance.example.yml in this directory)
# ---------------------------------------------------------------------------
services:
  glance:
    image: glanceapp/glance:v0.8.5
    container_name: glance
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./glance.yml:/app/config/glance.yml:ro
      - ./assets:/app/assets:ro
    environment:
      - TZ=Europe/Berlin
    # Read-only WUD API tokens for the Versions box (see compose/wud)
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
