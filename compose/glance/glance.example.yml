# ---------------------------------------------------------------------------
#  Glance - dashboard configuration
#
#  This is the LIVE configuration from LXC 102, published verbatim. It contains
#  no credentials of any kind: every value in it is a private RFC1918 address
#  or a hostname that is already public in Certificate Transparency logs.
#  That is why it ships as the real file rather than a redacted one - see
#  docs/99-security-notes.md.
#
#  Rendered result: assets/screenshots/glance-dashboard.png
#
#  The design rule behind the layout: this page exists to answer ONE question,
#  "is anything red", in about one second, from a phone. That is a lower bar
#  than a Grafana dashboard and it is why this page actually gets opened.
#
#  Copy to glance.yml, change the hostnames and addresses, restart the
#  container. The config is a read-only bind mount, so a restart is required;
#  Glance does not reload it in place.
# check with : docker cp glance:/app/config/glance.yml /tmp/glance.yml && cat /tmp/glance.yml
# ---------------------------------------------------------------------------

pages:
  - name: Homelab
    width: wide
    columns:
      - size: full
        widgets:
          - type: calendar
            first-day-of-week: monday

          # Two monitor groups side by side. split-column keeps them on one row
          # on a wide screen and stacks them on a phone, which is the screen
          # this page is actually read on.
          - type: split-column
            max-columns: 2
            widgets:

              - type: monitor
                title: Management
                cache: 1m
                sites:
                  # NOTE the pattern used throughout: `url` is where clicking
                  # the tile takes you (the friendly name, through the reverse
                  # proxy). `check-url` is what Glance actually probes - the
                  # service directly, by address and port.
                  #
                  # Splitting them means a red tile says "the service is down",
                  # not "the service is down OR DNS is broken OR the proxy is
                  # down OR the certificate expired". A health check that can
                  # fail for four unrelated reasons tells you nothing.
                  - title: Vaultwarden
                    url: https://vault.theminddev.com/
                    check-url: http://192.168.178.87:8081/alive
                    icon: "si:vaultwarden"
                    timeout: 5s
                  - title: Jellyfin
                    url: https://jelly0.theminddev.com/web/#/home.html
                    check-url: http://192.168.178.79:8899/health
                    icon: "si:jellyfin"
                    timeout: 5s
                  - title: "NPM"
                    url: https://npm.theminddev.com
                    check-url: http://192.168.178.178:81
                    icon: "si:nginxproxymanager"
                    # NPM's admin UI answers 401 when you are not logged in,
                    # which is a perfectly healthy response. Without this the
                    # tile is permanently red, and a dashboard with a
                    # permanently red tile trains you to ignore red tiles.
                    alt-status-codes: [301, 302, 303, 307, 308, 401, 403]
                  - title: "Grafana"
                    url: https://grafana.theminddev.com
                    # A real health endpoint, not the login page. This returns
                    # 200 only if Grafana can also reach its database.
                    check-url: http://192.168.178.87:3000/api/health
                    icon: "si:grafana"
                  - title: "Prometheus"
                    url: https://prom.theminddev.com
                    check-url: http://192.168.178.87:9090/-/ready
                    icon: "si:prometheus"
                  - title: "Portainer 0"
                    url: https://port0.theminddev.com
                    check-url: https://192.168.178.178:9442/api/status
                    icon: "si:portainer"
                    # Portainer serves its own self-signed certificate on 9443.
                    allow-insecure: true
                  - title: "Portainer 1"
                    url: https://port1.theminddev.com
                    check-url: https://192.168.178.87:9443/api/status
                    icon: "si:portainer"
                    allow-insecure: true
                  - title: "Apache"
                    url: https://apache.theminddev.com
                    check-url: http://192.168.178.87:80
                    icon: "si:apache"

              - type: monitor
                title: Applications
                cache: 1m
                sites:
                  - title: "AdGuard"
                    url: https://adguard.theminddev.com
                    check-url: http://192.168.178.178:8000
                    icon: "si:adguard"
                  - title: "AMP"
                    # amp-server (guest 107) lives in the DMZ (10.10.10.21).
                    # Reachable from here because of the floating firewall
                    # rule that passes 192.168.178.0/24 -> 10.10.10.0/24 for
                    # admin access - see docs/16-firewalls-and-pf.md.
                    url: https://amp.theminddev.com/
                    check-url: http://10.10.10.21:8080
                    icon: "mdi:server"
                  - title: "CasaOS"
                    url: https://casa.theminddev.com
                    check-url: http://192.168.178.59:90
                    icon: "mdi:server"
                    alt-status-codes: [301, 302, 303, 307, 308, 401, 403]
                  - title: "Pterodactyl Panel"
                    # pterodactyl-panel (guest 106), also in the DMZ.
                    url: http://10.10.10.22
                    check-url: http://10.10.10.22:80
                    icon: "mdi:gamepad-variant"
                    alt-status-codes: [301, 302, 303, 307, 308, 401, 403]
                  - title: "Omada Controller"
                    url: https://192.168.178.88:8043
                    check-url: https://192.168.178.88:8043
                    icon: "si:tp-link"
                    # self-signed certificate, same as Proxmox and Portainer.
                    allow-insecure: true
                  - title: "ProxCenter"
                    url: https://center.theminddev.com/
                    check-url: http://192.168.178.87:3080/api/health
                    icon: "si:proxmox"
                  - title: "n8n"
                    # no proxy host yet, so the tile links to the direct address.
                    url: http://192.168.178.87:5678
                    check-url: http://192.168.178.87:5678/healthz
                    icon: "si:n8n"

          # The three cluster nodes. A red tile here means the node is down or
          # has lost quorum; `pvecm status` on any surviving node says which.
          - type: monitor
            title: Hardware
            cache: 1m
            sites:
              - title: "P1"
                url: https://p1.theminddev.com
                check-url: https://192.168.178.20:8006/
                icon: "si:proxmox"
                allow-insecure: true
              - title: "P2"
                url: https://p2.theminddev.com
                check-url: https://192.168.178.77:8006/
                icon: "si:proxmox"
                allow-insecure: true
              - title: "P3"
                url: https://p3.theminddev.com
                check-url: https://192.168.178.50:8006/
                icon: "si:proxmox"
                allow-insecure: true
              - title: "OPNsense"
                # VM 200, the DMZ firewall. WAN leg address - see inventory.yml.
                # The GUI listens on HTTP port 80 only (the WAN rule allows
                # 80 from the LAN); HTTPS on 443 times out.
                url: https://192.168.178.60
                check-url: http://192.168.178.60/
                icon: "si:opnsense"

          # NAS services. Immich and Syncthing default ports are used below -
          # confirm against your actual container port mappings and adjust.
          - type: monitor
            title: NAS
            cache: 1m
            sites:
              - title: "Immich"
                url: http://192.168.178.79:2283
                check-url: http://192.168.178.79:2283/api/server/ping
                icon: "si:immich"
              - title: "Syncthing"
                url: http://192.168.178.79:8384
                check-url: http://192.168.178.79:8384/rest/noauth/health
                icon: "si:syncthing"
              - title: "MeTube"
                url: http://192.168.178.79:45333
                check-url: http://192.168.178.79:45333
                icon: "mdi:youtube"
              - title: "qBittorrent"
                # runs inside gluetun's network; this port is published on
                # gluetun, so red here means the VPN tunnel is down too.
                url: https://torrent.theminddev.com/
                check-url: http://192.168.178.79:8085
                icon: "si:qbittorrent"
              - title: "UGOS (NAS)"
                url: https://nas.theminddev.com/
                check-url: http://192.168.178.79:9999
                icon: "mdi:nas"
                alt-status-codes: [301, 302, 303, 307, 308]

          # VM 103 "agents" - Hermes and Openclaw dashboards.
          - type: monitor
            title: Agents
            cache: 1m
            sites:
              - title: "Hermes agent"
                url: http://192.168.178.91:9119
                check-url: http://192.168.178.91:9119
                icon: "mdi:robot"
              - title: "Openclaw agent"
                url: http://192.168.178.91:18789
                check-url: http://192.168.178.91:18789
                icon: "mdi:robot"

          # Docker versions from WUD on each Docker host (compose/wud).
          - type: custom-api
            title: Versions
            title-url: http://192.168.178.87:3003
            cache: 30m
            # Data comes from WUD (What's Up Docker) on each host. Requests are made
            # inside the template so one host being down doesn't break the whole box.
            # Tokens are read-only WUD API tokens from /opt/glance/.env (not in Git).
            # Colours: red = major update, yellow = minor/patch, green = up to date,
            # grey = can't be checked (tag like "latest" or "hardened", not a version).
            template: |

              {{/* One host card. Context: the parsed JSON array of WUD containers. */}}
              {{ define "card" }}
                {{ range .Array "" }}{{ if and (.Bool "image.tag.semver") (.Bool "updateAvailable") (eq (.String "updateKind.semverDiff") "major") }}
                <div class="flex justify-between items-center gap-10" style="padding:3px 0">
                  <span class="text-truncate color-highlight">{{ .String "name" }}{{ if ne (.String "status") "running" }} <span class="color-negative size-h6">stopped</span>{{ end }}</span>
                  <span class="shrink-0" style="font-variant-numeric:tabular-nums"><span class="color-subdue">{{ .String "image.tag.value" }} →</span> {{ if .Exists "result.link" }}<a href="{{ .String "result.link" }}" target="_blank" rel="noreferrer" style="color:hsl(0,80%,68%)">{{ .String "result.tag" }}</a>{{ else }}<span style="color:hsl(0,80%,68%)">{{ .String "result.tag" }}</span>{{ end }} <span style="font-size:.7em;padding:1px 6px;border-radius:4px;background:hsl(0,80%,68%);color:#111;font-weight:700;text-transform:uppercase;vertical-align:middle">major</span></span>
                </div>
                {{ end }}{{ end }}
                {{ range .Array "" }}{{ if and (.Bool "image.tag.semver") (.Bool "updateAvailable") (ne (.String "updateKind.semverDiff") "major") }}
                <div class="flex justify-between items-center gap-10" style="padding:3px 0">
                  <span class="text-truncate color-highlight">{{ .String "name" }}{{ if ne (.String "status") "running" }} <span class="color-negative size-h6">stopped</span>{{ end }}</span>
                  <span class="shrink-0" style="font-variant-numeric:tabular-nums"><span class="color-subdue">{{ .String "image.tag.value" }} →</span> {{ if .Exists "result.link" }}<a href="{{ .String "result.link" }}" target="_blank" rel="noreferrer" style="color:hsl(43,90%,58%)">{{ .String "result.tag" }}</a>{{ else }}<span style="color:hsl(43,90%,58%)">{{ .String "result.tag" }}</span>{{ end }} <span style="font-size:.7em;padding:1px 6px;border-radius:4px;background:hsl(43,90%,58%);color:#111;font-weight:700;text-transform:uppercase;vertical-align:middle">{{ .String "updateKind.semverDiff" }}</span></span>
                </div>
                {{ end }}{{ end }}
                <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
                {{ range .Array "" }}{{ if and (.Bool "image.tag.semver") (not (.Bool "updateAvailable")) }}<span title="{{ .String "image.tag.value" }}" style="font-size:.8em;padding:1px 7px;border-radius:10px;border:1px solid hsl(140,55%,50%);color:hsl(140,55%,60%)">✓ {{ .String "name" }}</span>{{ end }}{{ end }}
                {{ range .Array "" }}{{ if not (.Bool "image.tag.semver") }}<span title="tag '{{ .String "image.tag.value" }}' is not a version, so it can't be checked. Pin a version to track it." style="font-size:.8em;padding:1px 7px;border-radius:10px;border:1px dashed var(--color-text-subdue);" class="color-subdue">? {{ .String "name" }} <i>{{ .String "image.tag.value" }}</i></span>{{ end }}{{ end }}
                </div>
              {{ end }}

              {{ $lx := newRequest "http://192.168.178.87:3003/api/containers" | withHeader "Authorization" "Bearer ${WUD_TOKEN_LXC102}" | getResponse }}
              {{ $pi := newRequest "http://192.168.178.178:3003/api/containers" | withHeader "Authorization" "Bearer ${WUD_TOKEN_PI}" | getResponse }}
              {{ $nas := newRequest "http://192.168.178.79:3003/api/containers" | withHeader "Authorization" "Bearer ${WUD_TOKEN_NAS}" | getResponse }}

              {{/* Totals across all reachable hosts */}}
              {{ $maj := 0 }}{{ $min := 0 }}{{ $ok := 0 }}{{ $unk := 0 }}
              {{ $okL := eq $lx.Response.StatusCode 200 }}{{ $okP := eq $pi.Response.StatusCode 200 }}{{ $okN := eq $nas.Response.StatusCode 200 }}
              {{ if $okL }}{{ range $lx.JSON.Array "" }}{{ if not (.Bool "image.tag.semver") }}{{ $unk = add $unk 1 }}{{ else if and (.Bool "updateAvailable") (eq (.String "updateKind.semverDiff") "major") }}{{ $maj = add $maj 1 }}{{ else if .Bool "updateAvailable" }}{{ $min = add $min 1 }}{{ else }}{{ $ok = add $ok 1 }}{{ end }}{{ end }}{{ end }}
              {{ if $okP }}{{ range $pi.JSON.Array "" }}{{ if not (.Bool "image.tag.semver") }}{{ $unk = add $unk 1 }}{{ else if and (.Bool "updateAvailable") (eq (.String "updateKind.semverDiff") "major") }}{{ $maj = add $maj 1 }}{{ else if .Bool "updateAvailable" }}{{ $min = add $min 1 }}{{ else }}{{ $ok = add $ok 1 }}{{ end }}{{ end }}{{ end }}
              {{ if $okN }}{{ range $nas.JSON.Array "" }}{{ if not (.Bool "image.tag.semver") }}{{ $unk = add $unk 1 }}{{ else if and (.Bool "updateAvailable") (eq (.String "updateKind.semverDiff") "major") }}{{ $maj = add $maj 1 }}{{ else if .Bool "updateAvailable" }}{{ $min = add $min 1 }}{{ else }}{{ $ok = add $ok 1 }}{{ end }}{{ end }}{{ end }}

              {{/* Summary: one stacked bar + numbers */}}
              <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:6px">
                {{ if gt $maj 0 }}<div style="flex:{{ $maj }};background:hsl(0,80%,68%)"></div>{{ end }}
                {{ if gt $min 0 }}<div style="flex:{{ $min }};background:hsl(43,90%,58%)"></div>{{ end }}
                {{ if gt $ok 0 }}<div style="flex:{{ $ok }};background:hsl(140,55%,50%)"></div>{{ end }}
                {{ if gt $unk 0 }}<div style="flex:{{ $unk }};background:var(--color-text-subdue);opacity:.5"></div>{{ end }}
              </div>
              <div class="flex gap-15 size-h6" style="margin-bottom:14px;flex-wrap:wrap">
                <span><b style="color:hsl(0,80%,68%)">{{ $maj }}</b> major</span>
                <span><b style="color:hsl(43,90%,58%)">{{ $min }}</b> minor/patch</span>
                <span><b style="color:hsl(140,55%,55%)">{{ $ok }}</b> up to date</span>
                <span class="color-subdue"><b>{{ $unk }}</b> can't check</span>
              </div>

              {{/* One card per host */}}
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
                <div style="border:1px solid var(--color-separator);border-radius:6px;padding:10px 12px">
                  <div class="size-h5 uppercase color-subdue" style="margin-bottom:6px">LXC 102 · docker</div>
                  {{ if $okL }}{{ template "card" $lx.JSON }}{{ else }}<div class="color-negative">WUD unreachable</div>{{ end }}
                </div>
                <div style="border:1px solid var(--color-separator);border-radius:6px;padding:10px 12px">
                  <div class="size-h5 uppercase color-subdue" style="margin-bottom:6px">Raspberry Pi</div>
                  {{ if $okP }}{{ template "card" $pi.JSON }}{{ else }}<div class="color-negative">WUD unreachable</div>{{ end }}
                </div>
                <div style="border:1px solid var(--color-separator);border-radius:6px;padding:10px 12px">
                  <div class="size-h5 uppercase color-subdue" style="margin-bottom:6px">NAS · UGOS</div>
                  {{ if $okN }}{{ template "card" $nas.JSON }}{{ else }}<div class="color-subdue">not set up yet / unreachable</div>{{ end }}
                </div>
              </div>

          - type: bookmarks
            title: DietPi
            groups:
              - hide-arrow: true
                links:
                  - title: DietPi
                    description: 192.168.178.178
                    url: "#"
                    icon: "si:raspberrypi"

          # Bookmarks, not monitors: these exist to be clicked, and the raw
          # address is printed under every entry on purpose. The moment DNS
          # breaks is the moment you need the IP, and that is exactly the
          # moment a page full of friendly names becomes useless.
          #
          # Which is also why this page should be bookmarked by ADDRESS
          # (http://192.168.178.87:8080), not by name.
          - type: bookmarks
            title: Service addresses
            groups:
              - title: Management
                links:
                  - title: NPM
                    description: npm.theminddev.com
                    url: https://npm.theminddev.com
                  - title: Grafana
                    description: grafana.theminddev.com
                    url: https://grafana.theminddev.com
                  - title: Prometheus
                    description: prom.theminddev.com
                    url: https://prom.theminddev.com
                  - title: Portainer 0
                    description: port0.theminddev.com
                    url: https://port0.theminddev.com
                  - title: Portainer 1
                    description: port1.theminddev.com
                    url: https://port1.theminddev.com
                  - title: Apache
                    description: apache.theminddev.com
                    url: https://apache.theminddev.com
              - title: Applications
                links:
                  - title: AdGuard
                    description: adguard.theminddev.com
                    url: https://adguard.theminddev.com
                  - title: AMP
                    description: amp.theminddev.com (DMZ)
                    url: https://amp.theminddev.com/
                  - title: CasaOS
                    description: casa.theminddev.com
                    url: https://casa.theminddev.com
                  - title: Pterodactyl Panel
                    description: 10.10.10.22 (DMZ)
                    url: http://10.10.10.22
                  - title: Omada Controller
                    description: 192.168.178.88:8043
                    url: https://192.168.178.88:8043
                  - title: ProxCenter
                    description: center.theminddev.com
                    url: https://center.theminddev.com/
                  - title: n8n
                    description: 192.168.178.87:5678
                    url: http://192.168.178.87:5678
              - title: NAS
                links:
                  - title: Immich
                    description: 192.168.178.79:2283
                    url: http://192.168.178.79:2283
                  - title: Syncthing
                    description: 192.168.178.79:8384
                    url: http://192.168.178.79:8384
                  - title: MeTube
                    description: 192.168.178.79:45333
                    url: http://192.168.178.79:45333
                  - title: Jellyfin
                    description: jelly0.theminddev.com
                    url: https://jelly0.theminddev.com/web/#/home.html
                  - title: qBittorrent
                    description: torrent.theminddev.com (via gluetun)
                    url: https://torrent.theminddev.com/
                  - title: UGOS (NAS)
                    description: nas.theminddev.com
                    url: https://nas.theminddev.com/
                  - title: FTP (pure-ftpd)
                    description: ftp://192.168.178.87 - no HTTP health check
                    url: "#"
                    hide-arrow: true
              - title: Agents
                links:
                  - title: Hermes agent
                    description: 192.168.178.91:9119
                    url: http://192.168.178.91:9119
                  - title: Openclaw agent
                    description: 192.168.178.91:18789
                    url: http://192.168.178.91:18789
              - title: Hardware
                links:
                  - title: P1
                    description: p1.theminddev.com
                    url: https://p1.theminddev.com
                  - title: P2
                    description: p2.theminddev.com
                    url: https://p2.theminddev.com
                  - title: P3
                    description: p3.theminddev.com
                    url: https://p3.theminddev.com
                  - title: OPNsense
                    description: opn.theminddev.com
                    url: https://opn.theminddev.com/
                  - title: DietPi
                    description: 192.168.178.178
                    url: "#"
                    hide-arrow: true

# ---------------------------------------------------------------------------
#  Widgets deliberately NOT in this file
#
#  `dns-stats` against AdGuard, and `server-stats` against a remote agent,
#  both need credentials. The moment a credential enters this file it stops
#  being publishable verbatim, which is most of its value. If they get added,
#  they use environment variables from a .env and this file becomes
#  glance.example.yml in the proper sense.
#  NOTE: avoid writing literal ${...} even in comments - Glance expands
#  variables in the raw file before parsing, so a stray ${VARIABLES} in a
#  comment will fail to resolve and crash-loop the container.
# ---------------------------------------------------------------------------
