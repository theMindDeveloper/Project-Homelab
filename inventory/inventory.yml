  - {what: per-service DMZ subnets,   where: opnsense, why: wings, amp and panel are currently neighbours}
  - {what: egress filtering from DMZ, where: opnsense, why: a compromised game server can currently reach anything outbound}
  - {what: Proxmox TOTP 2FA,          where: cluster, why: root@pam with a password is the weakest remaining credential}
  - {what: k3s server,                where: pve,  why: declarative workloads and rescheduling}
  - {what: k3s agent,                 where: pve2, why: worker}
  - {what: k3s agent,                 where: pve3, why: worker}
  - {what: Nextcloud,                 where: pve3, why: files and sync - runbook already written}
  - {what: Jenkins,                   where: pve3, why: CI/CD}
  - {what: n8n,                       where: pve3, why: workflow automation - moved off lxc-102}
